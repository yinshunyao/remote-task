[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-task"
version = "0.1.0"
description = "Upload code to Ubuntu, register remote jobs, queue and run them over SSH."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "shunyaoyin" },
]
keywords = [
  "ssh",
  "rsync",
  "queue",
  "remote",
  "training",
  "ubuntu",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "paramiko>=3.0",
]

[project.optional-dependencies]
encrypt = ["pyfernet-payload>=0.2.5"]
dev = ["build", "pytest"]

[project.urls]
Homepage = "https://github.com/yinshunyao/remote-task"
Issues = "https://github.com/yinshunyao/remote-task/issues"
Documentation = "https://github.com/yinshunyao/remote-task#readme"

[project.scripts]
rtask = "remote_task.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["remote_task*"]

[tool.setuptools.package-data]
remote_task = ["py.typed", "_assets/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
